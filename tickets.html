<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - Happy Wednesdays</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <div class="p-4 md:p-8 max-w-7xl mx-auto space-y-10">
        
        <!-- Header -->
        <header class="py-8 flex justify-between items-center relative border-b border-slate-200 mb-8">
            <a href="index.html" class="text-slate-500 hover:text-slate-900 transition-colors flex items-center gap-2">
                &larr; Zurück zur Startseite
            </a>
            <h1 class="text-3xl font-bold text-slate-800">Aufgaben & Tickets</h1>
            <button onclick="openTicketModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-semibold shadow-sm transition-colors">
                + Ticket erstellen
            </button>
        </header>

        <!-- Statistik Übersicht -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Gesamt Tickets</p>
                    <h3 class="text-3xl font-bold text-slate-800" id="stat-total">0</h3>
                </div>
                <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-xl">📋</div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Offene Tickets</p>
                    <h3 class="text-3xl font-bold text-amber-600" id="stat-open">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center text-xl">⏳</div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-slate-500 text-sm font-medium">Erledigt</p>
                    <h3 class="text-3xl font-bold text-emerald-600" id="stat-done">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center text-xl">✅</div>
            </div>
        </div>

        <!-- Ticket Tabelle -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100">
                <h2 class="text-xl font-semibold text-slate-800">Alle Tickets</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider font-medium border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Titel & Typ</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Prio</th>
                            <th class="px-6 py-4">Zugewiesen an</th>
                            <th class="px-6 py-4">Tage offen</th>
                            <th class="px-6 py-4 text-right">Aktionen</th>
                        </tr>
                    </thead>
                    <tbody id="ticketTableBody" class="divide-y divide-slate-100">
                        <!-- Wird per JS gefüllt -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal für Ticket-Eingabe -->
    <div id="ticketModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl max-w-lg w-full relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeTicketModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 p-2">✕</button>
            <h3 class="text-xl font-bold mb-6 text-slate-900" id="modalTitle">Neues Ticket</h3>
            
            <form id="ticketForm" class="space-y-4" onsubmit="saveTicket(event)">
                <input type="hidden" id="ticketId">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Titel</label>
                    <input type="text" id="tTitle" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Typ</label>
                        <select id="tType" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            <option value="Feature">Feature</option>
                            <option value="Bug">Bug / Fehler</option>
                            <option value="Orga">Organisation</option>
                            <option value="Einkauf">Einkauf</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Priorität</label>
                        <select id="tPrio" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                            <option value="Niedrig">Niedrig</option>
                            <option value="Mittel" selected>Mittel</option>
                            <option value="Hoch">Hoch</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Zugewiesen an</label>
                    <select id="tAssignee" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <option value="Jeder">Jeder / Offen</option>
                        <option value="Manuel">Manuel</option>
                        <option value="Niklas">Niklas</option>
                        <option value="David">David</option>
                        <option value="Diyar">Diyar</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Deadline (optional)</label>
                    <input type="date" id="tDeadline" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Beschreibung</label>
                    <textarea id="tDesc" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeTicketModal()" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium transition-colors">Abbrechen</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-semibold shadow-md transition-all">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tickets = JSON.parse(localStorage.getItem('hw_tickets')) || [];

        function saveToLocal() {
            localStorage.setItem('hw_tickets', JSON.stringify(tickets));
            renderTickets();
        }

        function generateId() {
            return 'TKT-' + Math.floor(Math.random() * 9000 + 1000);
        }

        function openTicketModal(id = null) {
            document.getElementById('ticketModal').classList.remove('hidden');
            const form = document.getElementById('ticketForm');
            form.reset();

            if (id) {
                const ticket = tickets.find(t => t.id === id);
                document.getElementById('modalTitle').innerText = 'Ticket bearbeiten';
                document.getElementById('ticketId').value = ticket.id;
                document.getElementById('tTitle').value = ticket.title;
                document.getElementById('tType').value = ticket.type;
                document.getElementById('tPrio').value = ticket.prio;
                document.getElementById('tAssignee').value = ticket.assignee;
                document.getElementById('tDeadline').value = ticket.deadline || '';
                document.getElementById('tDesc').value = ticket.desc;
            } else {
                document.getElementById('modalTitle').innerText = 'Neues Ticket erstellen';
                document.getElementById('ticketId').value = '';
            }
        }

        function closeTicketModal() {
            document.getElementById('ticketModal').classList.add('hidden');
        }

        function saveTicket(e) {
            e.preventDefault();
            const id = document.getElementById('ticketId').value;
            
            const ticketData = {
                title: document.getElementById('tTitle').value,
                type: document.getElementById('tType').value,
                prio: document.getElementById('tPrio').value,
                assignee: document.getElementById('tAssignee').value,
                deadline: document.getElementById('tDeadline').value,
                desc: document.getElementById('tDesc').value
            };

            if (id) {
                // Bearbeiten
                const index = tickets.findIndex(t => t.id === id);
                tickets[index] = { ...tickets[index], ...ticketData };
            } else {
                // Neu erstellen
                ticketData.id = generateId();
                ticketData.status = 'Offen';
                ticketData.createdAt = new Date().toISOString();
                tickets.push(ticketData);
            }

            saveToLocal();
            closeTicketModal();
        }

        function deleteTicket(id) {
            if(confirm('Ticket wirklich löschen?')) {
                tickets = tickets.filter(t => t.id !== id);
                saveToLocal();
            }
        }

        function toggleStatus(id) {
            const ticket = tickets.find(t => t.id === id);
            ticket.status = ticket.status === 'Offen' ? 'Erledigt' : 'Offen';
            saveToLocal();
        }

        function calculateDaysOpen(dateString, status) {
            if (status === 'Erledigt') return '-';
            const created = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - created);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function getPrioColor(prio) {
            if(prio === 'Hoch') return 'text-red-600 bg-red-100';
            if(prio === 'Mittel') return 'text-amber-600 bg-amber-100';
            return 'text-emerald-600 bg-emerald-100';
        }

        function renderTickets() {
            const tbody = document.getElementById('ticketTableBody');
            tbody.innerHTML = '';
            
            let openCount = 0;
            let doneCount = 0;

            tickets.forEach(ticket => {
                if(ticket.status === 'Offen') openCount++;
                else doneCount++;

                const daysOpen = calculateDaysOpen(ticket.createdAt, ticket.status);
                const statusClass = ticket.status === 'Offen' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 font-mono text-slate-500 text-xs">${ticket.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-slate-800">${ticket.title}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${ticket.type}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusClass}">${ticket.status}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${getPrioColor(ticket.prio)}">${ticket.prio}</span>
                        </td>
                        <td class="px-6 py-4 font-medium text-slate-600">${ticket.assignee}</td>
                        <td class="px-6 py-4 text-slate-500">${daysOpen}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="toggleStatus('${ticket.id}')" class="text-xl hover:scale-110 transition-transform" title="Als ${ticket.status === 'Offen' ? 'Erledigt' : 'Offen'} markieren">
                                ${ticket.status === 'Offen' ? '✅' : '⏪'}
                            </button>
                            <button onclick="openTicketModal('${ticket.id}')" class="text-xl hover:scale-110 transition-transform" title="Bearbeiten">✏️</button>
                            <button onclick="deleteTicket('${ticket.id}')" class="text-xl hover:scale-110 transition-transform" title="Löschen">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            // Update Statistik
            document.getElementById('stat-total').innerText = tickets.length;
            document.getElementById('stat-open').innerText = openCount;
            document.getElementById('stat-done').innerText = doneCount;
        }

        // Initiales Rendern
        renderTickets();
    </script>
</body>
</html>
